name: URL Health Check

# (workflow re-saved to prompt GitHub Actions to pick it up)
on:
  schedule:
    # Runs every 3 hours, at minute 7 (off the hour, since on-the-hour cron
    # times are GitHub Actions' busiest and most delay-prone slot).
    # GitHub Actions cron is always UTC: 07, 3:07, 6:07, 9:07, 12:07, 15:07,
    # 18:07, 21:07 UTC.
    - cron: "7 */3 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run URL checks
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALWAYS_NOTIFY: "true"
        run: python check_urls.py
